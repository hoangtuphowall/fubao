<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bench — every tool, one page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171A;
    --panel:#1B1F24;
    --panel-2:#20252B;
    --border:#2B3138;
    --text:#ECE8E0;
    --text-dim:#9AA1A9;
    --text-faint:#6B7178;
    --accent:#E3A63E;
    --accent-dim:#B88430;
    --success:#5FA777;
    --danger:#E0645A;
    --info:#5C8CA8;
    --radius:6px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --display: 'Space Grotesk', var(--sans);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:#14171A; }
  a{ color:var(--accent); }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea, button{ font-family:inherit; font-size:14px; color:var(--text); }
  input, select, textarea{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:8px 10px;
    outline:none;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(227,166,62,0.15);
  }
  textarea{ resize:vertical; }
  .app{
    display:flex;
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-mark svg{ flex-shrink:0; }
  .brand-tag{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:4px;
  }
  nav.tool-nav{
    flex:1;
    overflow-y:auto;
    padding:10px 10px 20px;
  }
  .nav-group{ margin-bottom:14px; }
  .nav-group-label{
    font-size:11.5px;
    color:var(--text-faint);
    padding:8px 10px 4px;
    font-weight:500;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:8px 10px;
    color:var(--text-dim);
    font-size:13.5px;
    margin-bottom:2px;
  }
  .nav-item:hover{ background:var(--panel-2); color:var(--text); }
  .nav-item.active{
    background:var(--panel-2);
    color:var(--text);
    border-color:var(--border);
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .nav-icon{
    width:17px; height:17px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint);
  }
  .nav-item.active .nav-icon, .nav-item:hover .nav-icon{ color:var(--accent); }

  /* ---------- Workspace ---------- */
  .workspace{
    flex:1;
    min-width:0;
    padding:32px 40px 60px;
    max-width:900px;
  }
  .workspace-header{ margin-bottom:26px; }
  .workspace-header h1{
    font-family:var(--display);
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .workspace-header p{
    color:var(--text-dim);
    margin:0;
    font-size:14.5px;
    max-width:65ch;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; color:var(--text-dim); }
  .field input, .field select{ min-width:120px; }
  .btn{
    background:var(--accent);
    color:#181410;
    border:none;
    border-radius:var(--radius);
    padding:9px 16px;
    font-weight:600;
    font-size:14px;
  }
  .btn:hover{ background:#eeb455; }
  .btn:disabled{ background:var(--text-faint); color:var(--panel); cursor:not-allowed; }
  .btn-outline{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius);
    padding:9px 16px;
    font-weight:500;
    font-size:14px;
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:6px 11px; font-size:13px; }
  .dropzone{
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    padding:30px 20px;
    text-align:center;
    color:var(--text-dim);
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    color:var(--text);
    background:rgba(227,166,62,0.05);
  }
  .dropzone strong{ color:var(--accent); font-weight:600; }
  .hint{ color:var(--text-faint); font-size:12.5px; margin-top:8px; }
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
    margin-top:14px;
  }
  .stat{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .num{ font-family:var(--display); font-size:22px; font-weight:600; }
  .stat .lbl{ color:var(--text-dim); font-size:12px; margin-top:2px; }
  .file-list{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .file-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:9px 12px; font-size:13.5px;
  }
  .file-row .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .file-row .meta{ color:var(--text-faint); font-size:12px; flex-shrink:0; }
  .muted{ color:var(--text-dim); }
  .mono{ font-family:var(--mono); }
  .divider{ height:1px; background:var(--border); margin:18px 0; }
  .preview-img{ max-width:100%; max-height:280px; border-radius:var(--radius); border:1px solid var(--border); }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .two-col{ grid-template-columns:1fr; } }
  textarea.code, textarea.wide{ width:100%; font-family:var(--mono); font-size:13px; line-height:1.5; }
  .msg{ font-size:13px; padding:8px 12px; border-radius:var(--radius); margin-top:10px; }
  .msg.ok{ background:rgba(95,167,119,0.12); color:var(--success); border:1px solid rgba(95,167,119,0.3); }
  .msg.err{ background:rgba(224,100,90,0.12); color:var(--danger); border:1px solid rgba(224,100,90,0.3); }
  .swatch{ display:inline-block; width:16px; height:16px; border-radius:3px; border:1px solid var(--border); vertical-align:-3px; margin-right:6px; }
  .checks{ display:flex; gap:16px; flex-wrap:wrap; }
  .checks label{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text-dim); }
  .checks input{ width:auto; }
  .diff-add{ background:rgba(95,167,119,0.15); }
  .diff-del{ background:rgba(224,100,90,0.15); text-decoration:line-through; opacity:.75; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* mobile */
  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border); }
    nav.tool-nav{ max-height:200px; }
    .workspace{ padding:24px 18px 50px; max-width:100%; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" stroke="#E3A63E"/></svg>
        Bench
      </div>
      <div class="brand-tag">every tool, one page</div>
    </div>
    <nav class="tool-nav" id="nav"></nav>
  </aside>

  <main class="workspace">
    <div class="workspace-header">
      <h1 id="toolTitle"></h1>
      <p id="toolDesc"></p>
    </div>
    <div id="toolPanel"></div>
  </main>
</div>

<!-- Libraries: loaded once, used only by the tools that need them -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
"use strict";

/* ============================= helpers ============================= */

function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs){
    if (k === 'class') node.className = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return node;
}

function formatBytes(bytes){
  if (bytes === 0) return '0 B';
  const units = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function readAsArrayBuffer(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsArrayBuffer(file);
  });
}

function loadImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function makeDropzone(container, opts, onFiles){
  opts = opts || {};
  const dz = el('div', { class:'dropzone', tabindex:'0' }, [
    el('div', {}, [ el('strong', {}, [opts.action || 'Click to choose files']), document.createTextNode(' or drag them here') ]),
    el('div', { class:'hint' }, [ opts.hint || '' ])
  ]);
  const input = el('input', { type:'file', style:'display:none', accept: opts.accept || '', multiple: opts.multiple ? 'multiple' : null });
  dz.appendChild(input);
  dz.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if (input.files.length) onFiles(Array.from(input.files)); });
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) onFiles(files);
  });
  container.appendChild(dz);
  return dz;
}

function showMsg(container, text, ok){
  const old = container.querySelector('.msg');
  if (old) old.remove();
  container.appendChild(el('div', { class: 'msg ' + (ok ? 'ok' : 'err') }, [text]));
}

function panel(children){
  return el('div', { class:'panel' }, children);
}

/* ============================= TOOL: Image resize/convert/compress ============================= */

function toolImageResize(container){
  let sourceImg = null, sourceFile = null;
  const p = panel([]);
  container.appendChild(p);

  const dz = makeDropzone(p, { accept:'image/*', action:'Choose an image', hint:'PNG, JPG, WebP, GIF — up to your browser\u2019s limits' }, async files => {
    sourceFile = files[0];
    const url = await readAsDataURL(sourceFile);
    sourceImg = await loadImage(url);
    widthInput.value = sourceImg.naturalWidth;
    heightInput.value = sourceImg.naturalHeight;
    preview.src = url;
    preview.style.display = 'block';
    origStat.textContent = `${sourceImg.naturalWidth}\u00d7${sourceImg.naturalHeight} \u00b7 ${formatBytes(sourceFile.size)}`;
    controls.style.display = 'block';
  });

  const preview = el('img', { class:'preview-img', style:'display:none;margin-top:14px;' });
  p.appendChild(preview);
  const origStat = el('div', { class:'hint' });
  p.appendChild(origStat);

  const controls = el('div', { style:'display:none;margin-top:16px;' });
  let lockAspect = true;
  const widthInput = el('input', { type:'number', min:'1' });
  const heightInput = el('input', { type:'number', min:'1' });
  const lockBtn = el('label', {}, [ el('input', { type:'checkbox', checked:'checked', onchange:e=>lockAspect=e.target.checked }), ' Lock aspect ratio' ]);
  const formatSel = el('select', {}, [
    el('option', { value:'image/png' }, ['PNG']),
    el('option', { value:'image/jpeg' }, ['JPG']),
    el('option', { value:'image/webp' }, ['WebP']),
  ]);
  const qualityInput = el('input', { type:'range', min:'0.1', max:'1', step:'0.05', value:'0.85' });
  const qualityLabel = el('span', { class:'hint' }, ['85%']);
  qualityInput.addEventListener('input', () => qualityLabel.textContent = Math.round(qualityInput.value*100) + '%');

  widthInput.addEventListener('input', () => {
    if (lockAspect && sourceImg) heightInput.value = Math.round(widthInput.value * sourceImg.naturalHeight / sourceImg.naturalWidth);
  });
  heightInput.addEventListener('input', () => {
    if (lockAspect && sourceImg) widthInput.value = Math.round(heightInput.value * sourceImg.naturalWidth / sourceImg.naturalHeight);
  });

  const outStat = el('div', { class:'hint', style:'margin-top:10px;' });
  const genBtn = el('button', { class:'btn' }, ['Process image']);
  const dlBtn = el('button', { class:'btn-outline', style:'margin-left:8px;display:none;' }, ['Download']);
  let lastBlob = null, lastExt = 'png';

  genBtn.addEventListener('click', () => {
    if (!sourceImg) return;
    const w = parseInt(widthInput.value) || sourceImg.naturalWidth;
    const h = parseInt(heightInput.value) || sourceImg.naturalHeight;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (formatSel.value === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); }
    ctx.drawImage(sourceImg, 0, 0, w, h);
    canvas.toBlob(blob => {
      lastBlob = blob;
      lastExt = formatSel.value.split('/')[1];
      outStat.textContent = `Result: ${w}\u00d7${h} \u00b7 ${formatBytes(blob.size)}`;
      dlBtn.style.display = 'inline-block';
    }, formatSel.value, parseFloat(qualityInput.value));
  });
  dlBtn.addEventListener('click', () => {
    if (lastBlob) downloadBlob(lastBlob, (sourceFile.name.replace(/\.[^.]+$/,'') || 'image') + '.' + lastExt);
  });

  controls.appendChild(el('div', { class:'row' }, [
    el('div', { class:'field' }, [ el('label', {}, ['Width (px)']), widthInput ]),
    el('div', { class:'field' }, [ el('label', {}, ['Height (px)']), heightInput ]),
    el('div', { class:'field' }, [ el('label', {}, ['Format']), formatSel ]),
    el('div', { class:'field' }, [ el('label', {}, ['Quality']), el('div',{},[qualityInput, qualityLabel]) ]),
  ]));
  controls.appendChild(el('div', { style:'margin-top:6px;' }, [lockBtn]));
  controls.appendChild(el('div', { style:'margin-top:14px;' }, [genBtn, dlBtn]));
  controls.appendChild(outStat);
  p.appendChild(controls);
}

/* ============================= TOOL: Image <-> Base64 ============================= */

function toolImageBase64(container){
  const p1 = panel([ el('h3', { style:'margin-top:0;font-size:15px;' }, ['Image to Base64']) ]);
  container.appendChild(p1);
  const out1 = el('textarea', { class:'code wide', rows:'6', readonly:'readonly', placeholder:'Base64 output will appear here\u2026' });
  makeDropzone(p1, { accept:'image/*', action:'Choose an image' }, async files => {
    const dataUrl = await readAsDataURL(files[0]);
    out1.value = dataUrl;
  });
  p1.appendChild(out1);
  const copyBtn = el('button', { class:'btn-outline btn-sm', style:'margin-top:8px;' }, ['Copy to clipboard']);
  copyBtn.addEventListener('click', () => { out1.select(); navigator.clipboard.writeText(out1.value).catch(()=>{}); showMsg(p1, 'Copied.', true); });
  p1.appendChild(copyBtn);

  const p2 = panel([ el('h3', { style:'margin-top:0;font-size:15px;' }, ['Base64 to Image']) ]);
  container.appendChild(p2);
  const in2 = el('textarea', { class:'code wide', rows:'5', placeholder:'Paste a base64 / data: URL string here\u2026' });
  const preview2 = el('img', { class:'preview-img', style:'display:none;margin-top:12px;' });
  const renderBtn = el('button', { class:'btn', style:'margin-top:8px;' }, ['Render image']);
  const dlBtn2 = el('button', { class:'btn-outline', style:'margin-top:8px;margin-left:8px;display:none;' }, ['Download PNG']);
  renderBtn.addEventListener('click', () => {
    let v = in2.value.trim();
    if (!v.startsWith('data:')) v = 'data:image/png;base64,' + v;
    preview2.onerror = () => showMsg(p2, 'That doesn\u2019t look like valid base64 image data.', false);
    preview2.onload = () => { preview2.style.display = 'block'; dlBtn2.style.display = 'inline-block'; };
    preview2.src = v;
  });
  dlBtn2.addEventListener('click', () => {
    fetch(preview2.src).then(r => r.blob()).then(b => downloadBlob(b, 'decoded-image.png'));
  });
  p2.appendChild(in2);
  p2.appendChild(renderBtn);
  p2.appendChild(dlBtn2);
  p2.appendChild(preview2);
}

/* ============================= TOOL: QR code generator ============================= */

function toolQr(container){
  const p = panel([]);
  container.appendChild(p);
  const textInput = el('textarea', { class:'wide', rows:'3', placeholder:'Enter text or a URL\u2026' });
  const sizeSel = el('select', {}, [ ['200','Small (200px)'], ['300','Medium (300px)'], ['500','Large (500px)'] ].map(([v,t]) => el('option',{value:v},[t])) );
  sizeSel.value = '300';
  const genBtn = el('button', { class:'btn', style:'margin-top:10px;' }, ['Generate QR code']);
  const holder = el('div', { style:'margin-top:16px;display:flex;justify-content:center;' });
  const dlBtn = el('button', { class:'btn-outline', style:'margin-top:12px;display:none;' }, ['Download PNG']);

  genBtn.addEventListener('click', () => {
    holder.innerHTML = '';
    const size = parseInt(sizeSel.value);
    const box = el('div');
    holder.appendChild(box);
    if (typeof QRCode === 'undefined'){ showMsg(p, 'QR library failed to load — check your connection.', false); return; }
    new QRCode(box, { text: textInput.value || ' ', width: size, height: size, colorDark:'#14171A', colorLight:'#ffffff' });
    setTimeout(() => {
      const canvas = box.querySelector('canvas');
      if (canvas){
        dlBtn.style.display = 'inline-block';
        dlBtn.onclick = () => canvas.toBlob(b => downloadBlob(b, 'qrcode.png'));
      }
    }, 60);
  });

  p.appendChild(el('div', { class:'field' }, [ el('label', {}, ['Text or URL']), textInput ]));
  p.appendChild(el('div', { class:'row', style:'margin-top:10px;' }, [ el('div', { class:'field' }, [ el('label', {}, ['Size']), sizeSel ]), genBtn ]));
  p.appendChild(holder);
  p.appendChild(dlBtn);
}

/* ============================= TOOL: Zip files ============================= */

function toolZip(container){
  const p = panel([]);
  container.appendChild(p);
  const list = el('div', { class:'file-list' });
  let files = [];

  makeDropzone(p, { multiple:true, action:'Choose files to zip', hint:'Add as many as you like' }, newFiles => {
    files = files.concat(newFiles);
    renderList();
  });
  p.appendChild(list);

  function renderList(){
    list.innerHTML = '';
    files.forEach((f,i) => {
      list.appendChild(el('div', { class:'file-row' }, [
        el('span', { class:'name' }, [f.name]),
        el('span', { class:'meta' }, [formatBytes(f.size)]),
        el('button', { class:'btn-outline btn-sm', onclick:() => { files.splice(i,1); renderList(); } }, ['Remove'])
      ]));
    });
    zipBtn.disabled = files.length === 0;
  }

  const zipBtn = el('button', { class:'btn', style:'margin-top:14px;', disabled:'disabled' }, ['Create ZIP']);
  zipBtn.addEventListener('click', async () => {
    if (typeof JSZip === 'undefined'){ showMsg(p, 'ZIP library failed to load.', false); return; }
    zipBtn.disabled = true; zipBtn.textContent = 'Zipping\u2026';
    const zip = new JSZip();

function toolSplitPdf(container){
  const p = panel([]);
  container.appendChild(p);
  let file = null, pageCount = 0;
  const info = el('div', { class:'hint', style:'margin-top:10px;' });

  makeDropzone(p, { accept:'.pdf', action:'Choose a PDF file' }, async files => {
    file = files[0];
    if (typeof PDFLib === 'undefined'){ showMsg(p, 'PDF library failed to load.', false); return; }
    const bytes = await readAsArrayBuffer(file);
    const doc = await PDFLib.PDFDocument.load(bytes);
    pageCount = doc.getPageCount();
    info.textContent = `${file.name} \u2014 ${pageCount} page(s)`;
    rangeInput.placeholder = `e.g. 1-3, 5, 8-${pageCount}`;
    controls.style.display = 'block';
  });
  p.appendChild(info);

  const controls = el('div', { style:'display:none;margin-top:12px;' });
  const rangeInput = el('input', { type:'text', style:'min-width:260px;' });
  const goBtn = el('button', { class:'btn', style:'margin-left:8px;' }, ['Extract pages']);
  goBtn.addEventListener('click', async () => {
    try{
      const indices = parseRanges(rangeInput.value, pageCount);
      if (!indices.length){ showMsg(p, 'Enter a valid page range, e.g. 1-3, 5', false); return; }
      const bytes = await readAsArrayBuffer(file);
      const src = await PDFLib.PDFDocument.load(bytes);
      const out = await PDFLib.PDFDocument.create();
      const pages = await out.copyPages(src, indices.map(n => n - 1));
      pages.forEach(pg => out.addPage(pg));
      const outBytes = await out.save();
      downloadBlob(new Blob([outBytes], { type:'application/pdf' }), 'extracted.pdf');
      showMsg(p, `Extracted ${indices.length} page(s).`, true);
    } catch(e){
      showMsg(p, 'Couldn\u2019t process that: ' + e.message, false);
    }
  });
  controls.appendChild(el('div', { class:'field' }, [ el('label', {}, ['Pages to extract']), rangeInput ]));
  controls.appendChild(goBtn);
  p.appendChild(controls);
}

function parseRanges(str, max){
  const out = new Set();
  (str || '').split(',').forEach(part => {
    part = part.trim();
    if (!part) return;
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m){
      let a = parseInt(m[1]), b = parseInt(m[2]);
      if (a > b) [a,b] = [b,a];
      for (let i=a; i<=b; i++) if (i>=1 && i<=max) out.add(i);
    } else if (/^\d+$/.test(part)){
      const n = parseInt(part);
      if (n>=1 && n<=max) out.add(n);
    }
  });
  return Array.from(out).sort((a,b)=>a-b);
}

  let file = null;

  makeDropzone(p, { accept:'audio/*', action:'Choose an audio file', hint:'MP3, OGG, M4A, WebM \u2014 whatever your browser can play' }, files => {
    file = files[0];
    info.textContent = `${file.name} \u2014 ${formatBytes(file.size)}`;

    audioEl.style.display = 'block';
    goBtn.style.display = 'inline-block';
  });
  p.appendChild(info);
  p.appendChild(audioEl);

  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true; goBtn.textContent = 'Converting\u2026';
    try{
      const arrayBuffer = await readAsArrayBuffer(file);
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
      const wavBlob = encodeWav(audioBuffer);
      downloadBlob(wavBlob, file.name.replace(/\.[^.]+$/, '') + '.wav');
      showMsg(p, `Converted \u2014 ${formatBytes(wavBlob.size)}.`, true);
    } catch(e){
      showMsg(p, 'Couldn\u2019t decode that audio file: ' + e.message, false);
    }
    goBtn.disabled = false; goBtn.textContent = 'Convert to WAV';
  });
  p.appendChild(goBtn);
}

function encodeWav(audioBuffer){
  const numCh = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length * numCh * 2 + 44;
  const buffer = new ArrayBuffer(length);
  const view = new DataView(buffer);
  const channels = [];
  for (let i=0;i<numCh;i++) channels.push(audioBuffer.getChannelData(i));

  function writeString(offset, str){ for (let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + audioBuffer.length * numCh * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numCh * 2, true);
  view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, audioBuffer.length * numCh * 2, true);

  let offset = 44;
  for (let i=0; i<audioBuffer.length; i++){
    for (let ch=0; ch<numCh; ch++){
      let sample = Math.max(-1, Math.min(1, channels[ch][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }
  return new Blob([view], { type:'audio/wav' });
}

function toolDiff(container){
  const p = panel([]);
  container.appendChild(p);

  const out = el('div', { class:'panel', style:'background:var(--panel-2);margin-top:12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;display:none;' });
  goBtn.addEventListener('click', () => {
    const a = taA.value.split('\n'), b = taB.value.split('\n');
    const dp = Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
    for (let i=a.length-1;i>=0;i--) for (let j=b.length-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    let i=0,j=0; out.innerHTML=''; out.style.display='block';
    while (i<a.length && j<b.length){
      if (a[i]===b[j]){ out.appendChild(el('div', {}, [a[i] || '\u00a0'])); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]){ out.appendChild(el('div', { class:'diff-del' }, [a[i] || '\u00a0'])); i++; }
      else { out.appendChild(el('div', { class:'diff-add' }, [b[j] || '\u00a0'])); j++; }
    }
    while (i<a.length){ out.appendChild(el('div', { class:'diff-del' }, [a[i] || '\u00a0'])); i++; }
    while (j<b.length){ out.appendChild(el('div', { class:'diff-add' }, [b[j] || '\u00a0'])); j++; }
  });
  p.appendChild(goBtn);
  p.appendChild(out);
}

/* ============================= TOOL: Unit converter ============================= */

function toolUnitConvert(container){
  const p = panel([]);
  container.appendChild(p);
  const units = {
    length: { m:1, km:1000, cm:0.01, mm:0.001, mi:1609.344, yd:0.9144, ft:0.3048, in:0.0254 },
    weight: { kg:1, g:0.001, mg:0.000001, lb:0.45359237, oz:0.028349523125, ton:1000 },
    temperature: null,
  };
  const catSel = el('select', {}, [ ['length','Length'], ['weight','Weight'], ['temperature','Temperature'] ].map(([v,t]) => el('option',{value:v},[t])) );
  const fromSel = el('select', {});
  const toSel = el('select', {});
  const valIn = el('input', { type:'number', value:'1' });
  const resultOut = el('div', { class:'stat', style:'margin-top:14px;' }, [ el('div', { class:'num', id:'unitResult' }, ['\u2014']), el('div', { class:'lbl' }, ['Result']) ]);

  function populate(){
    const cat = catSel.value;
    fromSel.innerHTML = ''; toSel.innerHTML = '';
    const keys = cat === 'temperature' ? ['C','F','K'] : Object.keys(units[cat]);
    keys.forEach(k => { fromSel.appendChild(el('option',{value:k},[k])); toSel.appendChild(el('option',{value:k},[k])); });
    toSel.selectedIndex = keys.length > 1 ? 1 : 0;
    convert();
  }
  function toCelsius(v,u){ return u==='C'?v : u==='F'?(v-32)*5/9 : v-273.15; }
  function fromCelsius(v,u){ return u==='C'?v : u==='F'?v*9/5+32 : v+273.15; }
  function convert(){
    const cat = catSel.value;
    const v = parseFloat(valIn.value);
    let result;
    if (isNaN(v)) result = '\u2014';
    else if (cat === 'temperature') result = fromCelsius(toCelsius(v, fromSel.value), toSel.value);
    else result = v * units[cat][fromSel.value] / units[cat][toSel.value];
    document.getElementById('unitResult').textContent = typeof result === 'number' ? (Math.round(result*10000)/10000).toString() : result;
  }
  [catSel].forEach(x => x.addEventListener('change', populate));
  [fromSel,toSel,valIn].forEach(x => x.addEventListener('input', convert));

  p.appendChild(el('div', { class:'row' }, [
    el('div', { class:'field' }, [ el('label', {}, ['Category']), catSel ]),
    el('div', { class:'field' }, [ el('label', {}, ['Value']), valIn ]),
    el('div', { class:'field' }, [ el('label', {}, ['From']), fromSel ]),
    el('div', { class:'field' }, [ el('label', {}, ['To']), toSel ]),
  ]));
  p.appendChild(resultOut);
  populate();
}

/* ============================= app shell ============================= */

const nav = document.getElementById('nav');
const toolPanel = document.getElementById('toolPanel');
const toolTitle = document.getElementById('toolTitle');
const toolDesc = document.getElementById('toolDesc');

const categories = [...new Set(TOOLS.map(t => t.cat))];
categories.forEach(cat => {
  const group = el('div', { class:'nav-group' });
  group.appendChild(el('div', { class:'nav-group-label' }, [cat]));
  TOOLS.filter(t => t.cat === cat).forEach(t => {
    const btn = el('button', { class:'nav-item', id:'nav-'+t.id }, [
      el('span', { class:'nav-icon', html:t.icon }),
      el('span', {}, [t.name])
    ]);
    btn.addEventListener('click', () => selectTool(t.id));
    group.appendChild(btn);
  });
  nav.appendChild(group);
});

function selectTool(id){
  const tool = TOOLS.find(t => t.id === id);
  if (!tool) return;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-'+id);
  if (btn) btn.classList.add('active');
  toolTitle.textContent = tool.name;
  toolDesc.textContent = tool.desc;
  toolPanel.innerHTML = '';
  tool.render(toolPanel);
  history.replaceState(null, '', '#' + id);
}

const startId = (location.hash || '').replace('#','') || TOOLS[0].id;
selectTool(TOOLS.find(t => t.id === startId) ? startId : TOOLS[0].id);
